# HTTP: serve the ACME challenge, redirect everything else to HTTPS.
server {
    listen 80;
    server_name ultron.lsnw.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: the app.
server {
    listen 443 ssl;
    server_name ultron.lsnw.io;

    ssl_certificate     /etc/letsencrypt/live/ultron.lsnw.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ultron.lsnw.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for any client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the FastAPI container.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
